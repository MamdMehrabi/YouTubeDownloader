name: Direct File Downloader

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Direct file URL"
        required: true
        type: string

      upload_to:
        description: "Upload destination"
        required: true
        type: choice
        options:
          - repository
          - release
        default: repository

      output_name:
        description: "Output filename (optional)"
        required: false
        default: ""
        type: string

      release_tag:
        description: "Release tag"
        required: false
        default: "latest"
        type: string

permissions:
  contents: write

jobs:
  direct-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install wget
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

      - name: Create upload directory
        run: |
          mkdir -p uploads

      - name: Download file
        shell: bash
        run: |
          URL="${{ github.event.inputs.file_url }}"
          NAME="${{ github.event.inputs.output_name }}"

          if [ -z "$NAME" ]; then
            NAME=$(basename "$URL")
          fi

          echo "Downloading $URL"

          wget \
            --continue \
            --show-progress \
            --progress=bar:force \
            -O "uploads/$NAME" \
            "$URL"

      - name: Show downloaded file
        run: |
          ls -lh uploads

      - name: Commit to Repository
        if: github.event.inputs.upload_to == 'repository'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"

          git add uploads/

          git diff --cached --quiet && echo "Nothing to commit" && exit 0

          git commit -m "Upload downloaded file"
          git push

      - name: Create Release if not exists
        if: github.event.inputs.upload_to == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.event.inputs.release_tag }}" \
          || gh release create "${{ github.event.inputs.release_tag }}" \
          --title "${{ github.event.inputs.release_tag }}" \
          --notes "Automatic Release"

      - name: Upload Release Asset
        if: github.event.inputs.upload_to == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: uploads/*